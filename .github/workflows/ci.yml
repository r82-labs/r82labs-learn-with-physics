name: C++ CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov clang-format

    - name: Check C++ formatting
      run: |
        find . -name '*.cpp' -o -name '*.hpp' | sort | xargs clang-format -style=file --dry-run --Werror

    - name: Configure CMake (Debug with Coverage)
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build
      run: cmake --build build

    - name: Run Tests
      run: cd build && ctest --output-on-failure

    - name: Configure Example Consumer
      run: cmake -S example -B example/build -DCMAKE_BUILD_TYPE=Release

    - name: Build Example Consumer
      run: cmake --build example/build --config Release

    - name: Run Example Consumer
      run: ./example/build/example_consumer

    - name: Generate Coverage Report
      run: |
        lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,atleast,corrupt
        lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' --output-file coverage_filtered.info
        lcov --list coverage_filtered.info

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage_filtered.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  version-and-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, '[skip release]')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Bump version and push tag
      id: tag
      uses: mathieudutour/github-tag-action@v6.1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: patch
        custom_release_rules: "BREAKING CHANGE:major,feat:minor"

    - name: Create GitHub Release
      if: steps.tag.outputs.new_tag
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.new_tag }}
        body: Release ${{ steps.tag.outputs.new_tag }}
        draft: false
        prerelease: false



